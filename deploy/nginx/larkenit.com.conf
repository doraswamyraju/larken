# ==============================================================================
# Nginx Virtual Host: larkenit.com & www.larkenit.com
# Larken Technologies LLC - Production Corporate Website
# VPS IP: 147.93.107.21 | Backend Port: 5092
# Safe isolated configuration - will NOT interfere with other VPS applications
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name larkenit.com www.larkenit.com;

    # Let's Encrypt / Certbot Challenge validation directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Frontend React Static Build
    root /var/www/larken/client/dist;
    index index.html;

    # React Single Page App (SPA) client-side routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # High-performance static assets caching
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Node.js / Express API Reverse Proxy -> Port 5092
    location /api/ {
        proxy_pass http://127.0.0.1:5092;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 15M;
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}
